aid: derq
name: Derq
description: >-
  Derq is an MIT spinoff (founded 2016, with operations in Dubai and Detroit)
  building AI-powered intelligent transportation systems that help cities,
  departments of transportation, and infrastructure operators prevent crashes
  and improve traffic flow. Its hardware-agnostic platform ingests data from
  video cameras, radar, LiDAR, signal controllers, and connected/V2X
  infrastructure, then runs real-time edge computer vision and machine learning
  to detect, track, and predict the movement of vehicles, pedestrians, and
  cyclists. Derq surfaces safety and traffic intelligence — crashes, near
  misses, violations, conflicts, counts, and ATSPMs — through its dashboard and
  via APIs to third-party systems. Flagship products include Derq SENSE
  (real-time traffic detection and V2X perception) and Derq INSIGHT (road safety
  and traffic management analytics).
